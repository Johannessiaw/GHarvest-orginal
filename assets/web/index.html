<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GHarvest Local Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f6fb;
      color: #102a43;
    }
    h1 {
      margin-top: 0;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 24px rgba(16, 42, 67, 0.08);
    }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      border-radius: 999px;
      background-color: #246bff;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GHarvest</h1>
    <p>Welcome to the local HTML page loaded inside the Flutter WebView.</p>
    <p>This page is served from an asset bundle in the app.</p>
    <a class="button" href="https://flutter.dev">Learn more</a>
  </div>
</body>
</html>
